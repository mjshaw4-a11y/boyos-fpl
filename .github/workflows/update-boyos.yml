name: Update Boyos FPL data

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest FPL data
        run: node scripts/update-boyos.mjs

      - name: Commit data if changed
        run: |
          git config user.name "boyos-fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boyos-data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Boyos FPL data"
            git push
          fi
