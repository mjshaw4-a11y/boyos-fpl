name: Update FPL data

on:
  workflow_dispatch:
  schedule:
    # Hourly fallback Monday-Thursday
    - cron: '5 * * * 1-4'

    # Every 5 minutes Friday-Sunday
    - cron: '*/5 * * * 5,6,0'

permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest Boyos FPL data
        run: node scripts/update-boyos.mjs

      - name: Fetch latest George League FPL data
        run: node scripts/update-george-league.mjs

      - name: Commit data if changed
        run: |
          git config user.name "boyos-fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boyos-data.json george-league-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update FPL data"
          git pull --rebase origin main
          git push origin main
