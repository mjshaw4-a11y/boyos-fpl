name: Update FPL data

on:
  workflow_dispatch:
  schedule:
    # Regular fallback refresh every hour
    - cron: '5 * * * *'

    # Friday live window: every 5 mins
    - cron: '*/5 17-22 * * 5'

    # Saturday live window: every 5 mins
    - cron: '*/5 11-18 * * 6'
    - cron: '0 19 * * 6'

    # Sunday live window: every 5 mins
    - cron: '*/5 12-17 * * 0'
    - cron: '0 18 * * 0'

permissions:
  contents: write

concurrency:
  group: fpl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest Boyos FPL data
        run: node scripts/update-boyos.mjs

      - name: Fetch latest George League FPL data
        run: node scripts/update-george-league.mjs

      - name: Commit data if changed
        run: |
          git config user.name "boyos-fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boyos-data.json george-league-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update FPL data"
          git pull --rebase origin main
          git push origin main
